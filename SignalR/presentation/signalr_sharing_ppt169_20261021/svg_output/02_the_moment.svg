<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#5B21B6"/>
    </marker>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>

  <g id="header" data-pptx-bounds="64 60 1152 108">
    <text x="64" y="84" font-size="20" font-weight="600" fill="#007F9E">The moment</text>
    <text x="64" y="140" font-family="Cambria, serif" font-size="50" fill="#102A43">Anna clicks. Ben’s price changes.</text>
  </g>

  <g id="moment" data-pptx-bounds="64 196 500 420">
    <use data-icon="tabler-outline/hand-click" x="64" y="214" width="36" height="36" fill="#007F9E" stroke-width="2"/>
    <text x="116" y="242" font-size="28" fill="#243B53"><tspan font-weight="bold" fill="#102A43">Anna</tspan> bids $1,300</text>
    <text x="116" y="276" font-size="22" fill="#526B80">Item #12 · PLACE BID → CONFIRM</text>
    <line x1="82" y1="300" x2="82" y2="468" stroke="#5B21B6" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrowViolet)"/>
    <text x="116" y="384" font-family="Cambria, serif" font-size="38" font-style="italic" fill="#5B21B6">Who carried it?</text>
    <text x="116" y="420" font-size="22" fill="#526B80">no refresh · no polling code</text>
    <use data-icon="tabler-outline/browser" x="64" y="486" width="36" height="36" fill="#007F9E" stroke-width="2"/>
    <text x="116" y="514" font-size="28" fill="#243B53"><tspan font-weight="bold" fill="#102A43">Ben</tspan> sees $1,300</text>
    <text x="116" y="548" font-size="22" fill="#526B80">“You have been outbid” — instantly</text>
  </g>

  <line id="column-rule" data-pptx-role="decoration" x1="600" y1="200" x2="600" y2="620" stroke="#CAD7E2" stroke-width="1"/>

  <g id="questions" data-pptx-bounds="640 190 576 440">
    <text x="640" y="214" font-size="20" font-weight="600" fill="#007F9E">Four questions</text>
    <g font-family="Cambria, serif" font-size="50" fill="#007F9E">
      <text x="640" y="290">1</text>
      <text x="640" y="378">2</text>
      <text x="640" y="466">3</text>
      <text x="640" y="554">4</text>
    </g>
    <g font-size="28" fill="#243B53">
      <text x="700" y="282">What is SignalR?</text>
      <text x="700" y="370">What do we prepare?</text>
      <text x="700" y="458">How does Geronimo sync a bid?</text>
      <text x="700" y="546">Best practices: Do &amp; Avoid</text>
    </g>
    <g stroke="#CAD7E2" stroke-width="1">
      <line x1="640" y1="312" x2="1216" y2="312"/>
      <line x1="640" y1="400" x2="1216" y2="400"/>
      <line x1="640" y1="488" x2="1216" y2="488"/>
    </g>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 664 1152 30" font-size="16" fill="#526B80">
    <text x="64" y="684">SignalR — More Than WebSocket</text>
    <text x="1216" y="684" text-anchor="end">02</text>
  </g>
</svg>
