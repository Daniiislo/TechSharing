<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
<rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
<g id="header" data-pptx-bounds="64 60 1152 108">
<text x="64" y="84" font-size="24" font-weight="600" fill="#007F9E">4 · Best practices: Do &amp; Avoid</text>
<text x="64" y="140" font-family="Cambria, serif" font-size="50" fill="#102A43">Three rules for the next hub</text>
</g>
<g id="do-list" data-pptx-bounds="64 206 544 418">
<text x="64" y="244" font-family="Cambria, serif" font-size="40" fill="#007F9E">Do</text>
<text x="64" y="316" font-size="30" font-weight="bold" fill="#007F9E">Target the right audience</text>
<text x="64" y="360" font-size="26" fill="#243B53">Use Groups per event or item.</text>
<text x="64" y="438" font-size="30" font-weight="bold" fill="#007F9E">Use authenticated identity</text>
<text x="64" y="482" font-family="Consolas, monospace" font-size="26" fill="#243B53">[Authorize] + Context.UserIdentifier</text>
<text x="64" y="560" font-size="30" font-weight="bold" fill="#007F9E">Plan for multiple servers</text>
<text x="64" y="604" font-size="26" fill="#243B53">Backplane + sticky sessions where needed.</text>
</g>
<g id="avoid-list" data-pptx-bounds="704 206 512 418">
<text x="704" y="244" font-family="Cambria, serif" font-size="40" fill="#B36A13">Avoid</text>
<text x="704" y="316" font-size="30" font-weight="bold" fill="#B36A13">Broadcasting everything</text>
<text x="704" y="360" font-size="26" fill="#243B53">Send only data the audience may see.</text>
<text x="704" y="438" font-size="30" font-weight="bold" fill="#B36A13">Trusting a client-supplied user ID</text>
<text x="704" y="482" font-size="26" fill="#243B53">A caller can submit someone else’s ID.</text>
<text x="704" y="560" font-size="30" font-weight="bold" fill="#B36A13">Isolated servers</text>
<text x="704" y="604" font-size="26" fill="#243B53">Without scale-out, messages stay local.</text>
</g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 664 1152 30" font-size="16" fill="#526B80"><text x="64" y="684">SignalR — More Than WebSocket</text><text x="1216" y="684" text-anchor="end">14</text></g>
</svg>