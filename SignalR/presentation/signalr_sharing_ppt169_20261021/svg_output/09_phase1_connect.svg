<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#5B21B6"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#007F9E"/>
    </marker>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>

  <g id="header" data-pptx-bounds="64 60 1152 108">
    <text x="64" y="84" font-size="24" font-weight="600" fill="#007F9E">3 · How does Geronimo sync a bid? · Phase 1</text>
    <text x="64" y="140" font-family="Cambria, serif" font-size="50" fill="#102A43">Two lines, then SignalR takes over</text>
  </g>

  <g id="geronimo-code" data-pptx-bounds="64 192 404 384">
    <rect x="64" y="196" width="400" height="376" rx="4" fill="#E8F4F8" stroke="#007F9E" stroke-width="2"/>
    <text x="84" y="226" font-size="20" font-weight="bold" fill="#007F9E">Geronimo writes · itemBid.js</text>
    <g font-family="Consolas, monospace" font-size="20" fill="#102A43">
      <text x="84" y="268">const connection =</text>
      <text x="104" y="298">new HubConnectionBuilder()</text>
      <text x="104" y="328">.withUrl("/bidhub")</text>
      <text x="104" y="358">.withAutomaticReconnect()</text>
      <text x="104" y="388">.build();</text>
      <text x="84" y="436">connection.start()</text>
      <text x="104" y="466">.then(() =&gt;</text>
      <text x="124" y="496">bidButton.disabled = false);</text>
    </g>
    <text x="84" y="546" font-size="20" fill="#526B80">PLACE BID stays off until connected</text>
  </g>

  <g id="handoff" data-pptx-bounds="468 412 88 24">
    <line x1="470" y1="424" x2="552" y2="424" stroke="#007F9E" stroke-width="2" marker-end="url(#arrowCyan)"/>
  </g>

  <g id="signalr-sequence" data-pptx-bounds="560 192 656 384">
    <rect x="564" y="196" width="652" height="376" rx="4" fill="#F1EBFD" stroke="#5B21B6" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="584" y="226" font-size="20" font-weight="bold" fill="#5B21B6">SignalR does</text>
    <g font-size="20" font-weight="bold" fill="#102A43" text-anchor="middle">
      <text x="640" y="260">Browser</text>
      <text x="1140" y="260">Server</text>
    </g>
    <g stroke="#526B80" stroke-width="1" stroke-dasharray="4 4">
      <line x1="640" y1="272" x2="640" y2="556"/>
      <line x1="1140" y1="272" x2="1140" y2="556"/>
    </g>
    <g stroke="#5B21B6" stroke-width="2">
      <line x1="642" y1="304" x2="1136" y2="304" marker-end="url(#arrowViolet)"/>
      <line x1="1138" y1="344" x2="644" y2="344" marker-end="url(#arrowViolet)"/>
      <line x1="642" y1="384" x2="1136" y2="384" marker-end="url(#arrowViolet)"/>
      <line x1="1138" y1="424" x2="644" y2="424" marker-end="url(#arrowViolet)"/>
      <line x1="642" y1="464" x2="1136" y2="464" marker-end="url(#arrowViolet)"/>
      <line x1="1138" y1="504" x2="644" y2="504" marker-end="url(#arrowViolet)"/>
    </g>
    <line x1="644" y1="544" x2="1136" y2="544" stroke="#5B21B6" stroke-width="1.5" stroke-dasharray="8 4"/>
    <g font-family="Consolas, monospace" font-size="20" fill="#5B21B6" text-anchor="middle">
      <text x="890" y="296">POST /bidhub/negotiate</text>
      <text x="890" y="336">connectionToken · transports</text>
      <text x="890" y="376">GET /bidhub?id=… Upgrade</text>
      <text x="890" y="416">101 Switching Protocols</text>
      <text x="890" y="456">{"protocol":"json","version":1}</text>
      <text x="890" y="496">{}  → OnConnectedAsync</text>
      <text x="890" y="536">ping every 15 s, both ways</text>
    </g>
  </g>

  <g id="reconnect" data-pptx-bounds="64 592 1152 56">
    <line x1="64" y1="596" x2="1216" y2="596" stroke="#CAD7E2" stroke-width="1"/>
    <use data-icon="tabler-outline/refresh" x="64" y="610" width="28" height="28" fill="#B36A13" stroke-width="2"/>
    <text x="104" y="632" font-size="22" fill="#243B53"><tspan font-weight="bold" fill="#B36A13">Lost?</tspan>  <tspan fill="#007F9E">onreconnecting → banner</tspan>  ·  <tspan fill="#5B21B6">retry after 0, 2, 10, 30 s</tspan>  ·  <tspan fill="#007F9E">onreconnected → “Refresh your page”</tspan></text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 664 1152 30" font-size="16" fill="#526B80">
    <text x="64" y="684">SignalR — More Than WebSocket</text>
    <text x="1216" y="684" text-anchor="end">09</text>
  </g>
</svg>
