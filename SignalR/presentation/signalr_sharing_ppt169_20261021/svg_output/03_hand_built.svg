<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#5B21B6"/>
    </marker>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>

  <g id="header" data-pptx-bounds="64 60 1152 108">
    <text x="64" y="84" font-size="24" font-weight="600" fill="#007F9E">1 · What is SignalR?</text>
    <text x="64" y="140" font-family="Cambria, serif" font-size="50" fill="#102A43">Everything raw WebSocket leaves to you</text>
  </g>

  <g id="ledger" data-pptx-bounds="64 196 1152 420">
    <text x="64" y="222" font-size="20" font-weight="600" fill="#526B80">With raw WebSocket you write…</text>
    <text x="680" y="222" font-size="20" font-weight="600" fill="#5B21B6">SignalR gives you…</text>
    <line x1="64" y1="238" x2="1216" y2="238" stroke="#102A43" stroke-width="1.5"/>
    <g font-size="28" fill="#243B53">
      <text x="64" y="282">A reconnect loop</text>
      <text x="64" y="346">A fallback when WebSocket is blocked</text>
      <text x="64" y="410">Our own message format</text>
      <text x="64" y="474">Request ↔ response matching</text>
      <text x="64" y="538">A socket list and a broadcast loop</text>
      <text x="64" y="602">Sync between servers</text>
    </g>
    <g stroke="#5B21B6" stroke-width="2">
      <line x1="566" y1="272" x2="652" y2="272" marker-end="url(#arrowViolet)"/>
      <line x1="566" y1="336" x2="652" y2="336" marker-end="url(#arrowViolet)"/>
      <line x1="566" y1="400" x2="652" y2="400" marker-end="url(#arrowViolet)"/>
      <line x1="566" y1="464" x2="652" y2="464" marker-end="url(#arrowViolet)"/>
      <line x1="566" y1="528" x2="652" y2="528" marker-end="url(#arrowViolet)"/>
      <line x1="566" y1="592" x2="652" y2="592" marker-end="url(#arrowViolet)"/>
    </g>
    <g font-size="28" fill="#5B21B6">
      <text x="680" y="282">withAutomaticReconnect()</text>
      <text x="680" y="346">WebSockets › SSE › Long Polling</text>
      <text x="680" y="410">Hub Protocol: JSON · MessagePack</text>
      <text x="680" y="474">invoke() + invocationId</text>
      <text x="680" y="538">Clients.All · Caller · User · Group</text>
      <text x="680" y="602">Redis backplane · Azure SignalR</text>
    </g>
    <g stroke="#CAD7E2" stroke-width="1">
      <line x1="64" y1="304" x2="1216" y2="304"/>
      <line x1="64" y1="368" x2="1216" y2="368"/>
      <line x1="64" y1="432" x2="1216" y2="432"/>
      <line x1="64" y1="496" x2="1216" y2="496"/>
      <line x1="64" y1="560" x2="1216" y2="560"/>
    </g>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 664 1152 30" font-size="16" fill="#526B80">
    <text x="64" y="684">SignalR — More Than WebSocket</text>
    <text x="1216" y="684" text-anchor="end">03</text>
