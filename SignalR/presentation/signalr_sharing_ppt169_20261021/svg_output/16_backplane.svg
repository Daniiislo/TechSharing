<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#5B21B6"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#007F9E"/>
    </marker>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>

  <g id="header" data-pptx-bounds="64 60 1152 108">
    <text x="64" y="84" font-size="24" font-weight="600" fill="#007F9E">Backup · Scale-out</text>
    <text x="64" y="140" font-family="Cambria, serif" font-size="50" fill="#102A43">Redis backplane: one message, every server</text>
    <rect x="936" y="70" width="22" height="14" rx="2" fill="#E8F4F8" stroke="#007F9E" stroke-width="1.5"/>
    <text x="966" y="83" font-size="16" fill="#526B80">Geronimo code</text>
    <rect x="1096" y="70" width="22" height="14" rx="2" fill="#F1EBFD" stroke="#5B21B6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="1126" y="83" font-size="16" fill="#526B80">SignalR</text>
  </g>

  <g id="clients" data-pptx-bounds="64 196 766 60">
    <rect x="64" y="196" width="340" height="60" rx="4" fill="#FFFFFF" stroke="#CAD7E2" stroke-width="1.5"/>
    <text x="84" y="224" font-size="22" font-weight="bold" fill="#102A43">Anna · bidder</text>
    <text x="84" y="246" font-size="16" fill="#526B80">connected to Server A</text>
    <rect x="490" y="196" width="340" height="60" rx="4" fill="#FFFFFF" stroke="#CAD7E2" stroke-width="1.5"/>
    <text x="510" y="224" font-size="22" font-weight="bold" fill="#102A43">Ben · watching</text>
    <text x="510" y="246" font-size="16" fill="#526B80">connected to Server B</text>
  </g>

  <g id="server-a" data-pptx-bounds="64 300 340 202">
    <rect x="64" y="300" width="340" height="202" rx="4" fill="#FFFFFF" stroke="#CAD7E2" stroke-width="1.5"/>
    <text x="84" y="330" font-size="22" font-weight="bold" fill="#102A43">Server A</text>
    <text x="384" y="330" font-size="16" fill="#526B80" text-anchor="end">holds Anna only</text>
    <rect x="84" y="346" width="300" height="62" rx="4" fill="#E8F4F8" stroke="#007F9E" stroke-width="2"/>
    <g font-family="Consolas, monospace" font-size="18" fill="#102A43">
      <text x="98" y="372">Clients.All.SendAsync(</text>
      <text x="118" y="396">"updateItem", ...)</text>
    </g>
    <rect x="84" y="424" width="300" height="62" rx="4" fill="#F1EBFD" stroke="#5B21B6" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="98" y="450" font-family="Consolas, monospace" font-size="20" fill="#5B21B6">HubLifetimeManager</text>
    <text x="98" y="474" font-size="16" fill="#243B53">knows only Server A's connections</text>
  </g>

  <g id="server-b" data-pptx-bounds="490 300 340 202">
    <rect x="490" y="300" width="340" height="202" rx="4" fill="#FFFFFF" stroke="#CAD7E2" stroke-width="1.5"/>
    <text x="510" y="330" font-size="22" font-weight="bold" fill="#102A43">Server B</text>
    <text x="810" y="330" font-size="16" fill="#526B80" text-anchor="end">holds Ben only</text>
    <rect x="510" y="346" width="300" height="62" rx="4" fill="#FFFFFF" stroke="#CAD7E2" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="528" y="383" font-size="18" fill="#526B80">BidHub.AddBid not run here</text>
    <rect x="510" y="424" width="300" height="62" rx="4" fill="#F1EBFD" stroke="#5B21B6" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="524" y="450" font-family="Consolas, monospace" font-size="20" fill="#5B21B6">HubLifetimeManager</text>
    <text x="524" y="474" font-size="16" fill="#243B53">knows only Server B's connections</text>
  </g>

  <g id="flow-top" data-pptx-bounds="64 256 766 44">
    <!-- 1 Anna invokes AddBid on Server A -->
    <line x1="130" y1="258" x2="130" y2="298" stroke="#007F9E" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <circle cx="106" cy="278" r="13" fill="#007F9E"/>
    <text x="106" y="284" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="146" y="284" font-family="Consolas, monospace" font-size="16" fill="#007F9E">invoke("AddBid")</text>
    <!-- 2 Server A sends to its own connections -->
    <line x1="350" y1="298" x2="350" y2="258" stroke="#5B21B6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowViolet)"/>
    <circle cx="326" cy="278" r="13" fill="#5B21B6"/>
    <text x="326" y="284" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="368" y="284" font-family="Consolas, monospace" font-size="16" fill="#5B21B6">updateItem</text>
    <!-- 5 Server B writes to Ben -->
    <line x1="660" y1="298" x2="660" y2="258" stroke="#5B21B6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowViolet)"/>
    <circle cx="684" cy="278" r="13" fill="#5B21B6"/>
    <text x="684" y="284" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="706" y="284" font-family="Consolas, monospace" font-size="16" fill="#5B21B6">updateItem</text>
  </g>

  <g id="flow-bottom" data-pptx-bounds="64 502 766 58">
    <!-- 3 Server A publishes to Redis -->
    <line x1="234" y1="504" x2="234" y2="556" stroke="#5B21B6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowViolet)"/>
    <circle cx="210" cy="530" r="13" fill="#5B21B6"/>
    <text x="210" y="536" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="254" y="536" font-size="16" font-weight="bold" fill="#5B21B6">publish</text>
    <!-- 4 Redis forwards to Server B -->
    <line x1="660" y1="558" x2="660" y2="506" stroke="#5B21B6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowViolet)"/>
    <circle cx="684" cy="530" r="13" fill="#5B21B6"/>
    <text x="684" y="536" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="702" y="536" font-size="16" font-weight="bold" fill="#5B21B6">same message</text>
  </g>

  <g id="redis" data-pptx-bounds="64 560 766 88">
    <rect x="64" y="560" width="766" height="88" rx="4" fill="#F1EBFD" stroke="#5B21B6" stroke-width="1.5" stroke-dasharray="7 5"/>
    <use data-icon="tabler-outline/database" x="84" y="584" width="24" height="24" fill="#5B21B6" stroke-width="2"/>
    <text x="118" y="604" font-size="20" font-weight="bold" fill="#5B21B6">Redis backplane</text>
    <text x="84" y="634" font-size="16" fill="#243B53">Pub/Sub between servers · SignalR messages only</text>
    <rect x="530" y="580" width="280" height="48" rx="4" fill="#E8F4F8" stroke="#007F9E" stroke-width="2"/>
    <text x="670" y="610" font-family="Consolas, monospace" font-size="17" fill="#102A43" text-anchor="middle">.AddStackExchangeRedis()</text>
  </g>

  <g id="does" data-pptx-bounds="860 196 356 232">
    <rect x="860" y="196" width="356" height="232" rx="4" fill="#F1EBFD" stroke="#5B21B6" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="880" y="228" font-size="20" font-weight="bold" fill="#5B21B6">What it does</text>
    <g font-size="18" fill="#243B53">
      <circle cx="886" cy="262" r="4" fill="#5B21B6"/>
      <text x="902" y="268">Relays SignalR messages</text>
      <text x="902" y="292">between servers (Pub/Sub)</text>
      <circle cx="886" cy="322" r="4" fill="#5B21B6"/>
      <text x="902" y="328">Clients.All · Group · User</text>
      <text x="902" y="352">reach every server's clients</text>
      <circle cx="886" cy="382" r="4" fill="#5B21B6"/>
      <text x="902" y="388">Your hub code stays the same</text>
      <text x="902" y="410" font-size="16" fill="#526B80">only the manager is swapped</text>
    </g>
  </g>

  <g id="does-not" data-pptx-bounds="860 444 356 204">
    <rect x="860" y="444" width="356" height="204" rx="4" fill="#FFFFFF" stroke="#CAD7E2" stroke-width="1.5"/>
    <text x="880" y="476" font-size="20" font-weight="bold" fill="#B36A13">What it does not do</text>
    <g font-size="18" fill="#243B53">
      <circle cx="886" cy="510" r="4" fill="#B36A13"/>
      <text x="902" y="516">Move connections:</text>
      <text x="902" y="540">sticky sessions still apply</text>
      <circle cx="886" cy="574" r="4" fill="#B36A13"/>
      <text x="902" y="580">Replay messages missed</text>
      <text x="902" y="604">while a client was offline</text>
      <circle cx="886" cy="632" r="4" fill="#B36A13"/>
      <text x="902" y="638">Replace the database</text>
    </g>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 664 1152 30" font-size="16" fill="#526B80">
    <text x="64" y="684">SignalR — More Than WebSocket</text>
    <text x="1216" y="684" text-anchor="end">16</text>
  </g>
</svg>
