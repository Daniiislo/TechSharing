<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
<rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7F9FC" />
<g id="header" data-pptx-bounds="64 60 1152 108">
<text x="64" y="84" font-size="24" font-weight="600" fill="#007F9E">4 · Best practices: Do &amp; Avoid</text>
<text x="64" y="140" font-family="Cambria, serif" font-size="50" fill="#102A43">Who chooses the bidder? The client.</text>
</g>
<g id="client" data-pptx-bounds="64 202 520 222">
<text x="64" y="230" font-size="26" font-weight="bold" fill="#007F9E">ANNA SENDS BEN’S ID</text>
<text x="64" y="284" font-family="Consolas, monospace" font-size="27" fill="#102A43">invoke("AddBid", itemId,</text>
<text x="64" y="338" font-family="Consolas, monospace" font-size="40" font-weight="bold" fill="#B36A13">  "ben-id"<tspan font-size="27" font-weight="normal" fill="#102A43">, amount, ...)</tspan></text>
<text x="64" y="394" font-size="25" fill="#243B53">The argument says Ben. The caller is Anna.</text>
</g>
<text x="610" y="314" font-size="44" fill="#526B80">→</text>
<g id="server" data-pptx-bounds="704 202 512 222">
<text x="704" y="230" font-size="26" font-weight="bold" fill="#007F9E">SERVER USES THAT ID</text>
<text x="704" y="284" font-family="Consolas, monospace" font-size="27" fill="#102A43">GetBidContextAsync</text>
<text x="704" y="324" font-size="27" fill="#243B53">Loads Ben; checks Ben’s eligibility.</text>
<text x="704" y="376" font-family="Consolas, monospace" font-size="27" fill="#102A43">CreateBid</text>
<text x="704" y="416" font-size="30" font-weight="bold" fill="#B36A13">Records Ben as the bidder.</text>
</g>
<g id="risk" data-pptx-bounds="64 448 1152 64">
<text x="64" y="488" font-family="Cambria, serif" font-size="36" font-weight="bold" fill="#B36A13">Anna places the bid. Ben is recorded as responsible.</text>
</g>
<g id="fix-auth" data-pptx-bounds="64 536 540 100">
<text x="64" y="566" font-family="Consolas, monospace" font-size="38" font-weight="bold" fill="#007F9E">[Authorize]</text>
<text x="64" y="610" font-size="26" fill="#243B53">Require login for AddBid / AddBids.</text>
</g>
<g id="fix-identity" data-pptx-bounds="672 536 544 100">
<text x="672" y="566" font-family="Consolas, monospace" font-size="32" font-weight="bold" fill="#007F9E">Context.UserIdentifier</text>
<text x="672" y="610" font-size="25" fill="#243B53">Use the caller’s ID; remove the client ID.</text>
</g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 650 1152 44" font-size="16" fill="#526B80">
<text x="64" y="684">SignalR — More Than WebSocket</text><text x="1216" y="684" text-anchor="end">13</text>
</g>
</svg>