<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalR BidLab</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/bootstrap.min.css">
<link rel="stylesheet" href="vendor/font-awesome.min.css">
<link rel="stylesheet" href="css/tpa-item.css">
<link rel="stylesheet" href="css/lab.css">
</head>
<body class="lab">

<header class="lab-top">
  <h1>SignalR BidLab</h1>
  <div class="phase" role="group" aria-label="Giai đoạn">
    <button type="button" data-phase="phase1" aria-pressed="false">① Kết nối vào bid</button>
    <button type="button" data-phase="phase2" aria-pressed="true">② Bid &amp; nhận cập nhật</button>
  </div>
  <div class="spacer"></div>
  <label class="scenario">Kịch bản
    <select id="ctl-scenario">
      <option value="normal">Anna bid $1,300</option>
      <option value="too-low">Bid quá thấp</option>
      <option value="max-bid">Max bid của Ben</option>
    </select>
  </label>
  <button type="button" id="ctl-reset" class="ghost">Đặt lại</button>
</header>

<main class="lab-main">
  <section class="users" aria-label="Hai người dùng">
    <article class="win" data-user="anna" aria-label="Trình duyệt của Anna"></article>
    <article class="win" data-user="ben" aria-label="Trình duyệt của Ben"></article>
  </section>

  <section class="sim" aria-label="Mô phỏng phía dưới">
    <div class="sim-head">
      <h2 id="sim-title">Phía sau nút PLACE BID</h2>
      <p id="sim-sub">Chọn kịch bản rồi bấm PLACE BID ở trình duyệt Anna</p>
      <div class="legend">
        <span class="chip app">Geronimo viết</span>
        <span class="chip sr">SignalR tự làm</span>
      </div>
    </div>

    <div class="stage">
      <svg id="stage" viewBox="0 0 900 400" preserveAspectRatio="xMidYMin meet" role="img"
           aria-label="Sơ đồ ba lớp: code Geronimo, SignalR, mạng; ba cột: trình duyệt Anna, server, trình duyệt Ben"></svg>
    </div>

    <div class="inspect">
      <ol id="steps" class="steps" aria-label="Các bước"></ol>
      <div class="detail">
        <div id="detail" aria-live="polite"></div>
        <div class="controls">
          <button type="button" id="ctl-prev">⏮ Trước</button>
          <button type="button" id="ctl-play" class="primary">▶ Chạy</button>
          <button type="button" id="ctl-next">Tiếp ⏭</button>
          <label class="speed">Tốc độ
            <select id="ctl-speed"><option value="0.5" selected>0.5×</option><option value="1">1×</option><option value="2">2×</option></select>
          </label>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- Trang Item của TravelPledgeAuctions (Pages/Item.cshtml), rút gọn phần không liên quan đến bid. -->
<template id="item-page">
  <div class="win-bar">
    <span class="who"></span>
    <span class="url">hopefoundation.winningbidder.com/Item/1042</span>
    <span class="conn" data-role="conn-state">Chưa kết nối</span>
    <button type="button" class="win-btn" data-role="connect">Kết nối</button>
    <button type="button" class="win-btn" data-role="offline" aria-pressed="false">Ngắt mạng</button>
  </div>
  <div class="win-body">
    <div data-role="conn-banner" class="conn-banner" role="status" hidden></div>
    <div data-role="toast-host" class="toast-host" aria-live="polite"></div>
    <div class="page">
      <input type="hidden" data-role="bidder-id">
      <div class="row align-items-center">
        <div class="col-6 charity-logo"><span class="logo-box">Hope Foundation</span></div>
        <div class="col-6 text-right">
          <h2 class="auction-title">Hope Gala 2026 Online Auction</h2>
          <div class="auction-times"><span class="auction-status-live">Bidding is open!</span>&nbsp;&nbsp;Closes Oct 30, 9:00 PM CDT</div>
        </div>
      </div>
      <div class="header-wrapper">
        <h4 class="line-header item-title">Item #12</h4>
        <div class="item-list-link"><a href="#" tabindex="-1"><i class="fa fa-angle-left" aria-hidden="true"></i> All Items</a></div>
      </div>
      <div class="row item-details">
        <div class="col-6">
          <div class="sub-block-slider">
            <div class="bid-count-circle"><span data-role="bid-circle-count">7</span><br><small>bids</small></div>
            <img src="vendor/img/DonatedItemGiftBox.png" alt="Maui Getaway" width="400" height="400">
          </div>
        </div>
        <div class="col-6">
          <h2>Maui Getaway – 5 Nights at Wailea</h2>
          <div class="fti"><h4><i class="fa fa-map-marker" aria-hidden="true"></i> Maui, Hawaii</h4></div>
          <div class="favorite-icon-detail"><i class="fa fa-heart" aria-hidden="true"></i> This item is on <a href="#" tabindex="-1">My Watchlist</a></div>

          <div class="tm bid-panel" data-role="bid-panel">
            <div id="winning-bid" data-role="winning-bid" hidden>You are the high bidder!</div>
            <div class="bid-panel-box">
              <div id="outbid-bid" data-role="outbid-bid" hidden>You have been outbid!</div>
              <div class="currentbid-info">
                <div class="currentbid-label" data-role="current-bid-label">Current high bid is:</div>
                <h1 class="currentbid-amount" data-role="current-bid-amount">$1,250</h1>
              </div>
              <div class="text-center">
                <label>Enter your bid for this item: <i class="fa fa-info-circle" aria-hidden="true" style="opacity:.7;color:#385e7c"></i></label>
                <div class="max-bid-amt buttons_added">
                  <button type="button" class="minus" data-role="minus" aria-label="Giảm 50">-</button>
                  <input class="form-control input-bid-amount" data-role="max-bid-amount" value="$1,300" aria-label="Số tiền bid">
                  <button type="button" class="plus" data-role="plus" aria-label="Tăng 50">+</button>
                </div>
                <div class="bid-type-wrapper" role="group" aria-label="Loại bid">
                  <button type="button" class="bid-type-tab bid-type-left bid-type-tab-active" data-role="bid-type-exact" aria-pressed="true">Exact Bid</button>
                  <button type="button" class="bid-type-tab bid-type-right" data-role="bid-type-max" aria-pressed="false">Maximum Bid</button>
                </div>
                <button type="button" class="btn btn-primary btn-style btn-bid mt-4" data-role="bid-button" disabled>PLACE BID</button><br>
                <button type="button" class="btn btn-style btn-buy-it-now" data-role="buynow-button" disabled title="Không thuộc phạm vi demo">Buy it now for $3,000</button>
              </div>
              <div class="clockdiv"><span class="smalltext">Time left:</span> <span class="num">8</span><span class="smalltext">d</span> <span class="num">4</span><span class="smalltext">h</span> <span class="num">12</span><span class="smalltext">m</span> <span class="num">37</span><span class="smalltext">s</span></div>
            </div>
          </div>

          <div class="tm bid-panel-confirm" data-role="confirm-panel" hidden>
            <div class="text-center"><h2>CONFIRM BID</h2></div>
            <div class="text-center"><h3><span data-role="confirm-bid-type-label">Your exact bid:</span> <span class="nextbid" data-role="confirm-bid-amount">$1,300</span></h3></div>
            <div class="text-center mt-2 mb-4"><button type="button" class="btn btn-success btn-style" data-role="confirm-bid-button">CONFIRM</button></div>
            <div class="text-center font-size-12"><p>By clicking "CONFIRM", you agree to the auction rules<br>and will pay for this item if you win. You are not being charged now.</p></div>
            <div class="text-center mt-2 mb-2"><button type="button" class="link-btn" data-role="confirm-cancel">Cancel</button></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="vendor/signalr.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
