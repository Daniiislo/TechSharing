<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC" />
<g id="title" data-pptx-bounds="64 48 1152 130"><text x="64" y="72" font-size="18" fill="#007F9E">SERVER-SIDE ENFORCEMENT</text><text x="64" y="139" font-family="Cambria, serif" font-size="46" fill="#102A43">Revoked Must Mean Rejected</text></g>
<g id="request-enforcement" data-pptx-bounds="64 206 720 361"><line x1="64" y1="209" x2="64" y2="548" stroke="#007F9E" stroke-width="3" />
<text x="92" y="248" font-size="28" fill="#102A43">Session</text><text x="92" y="285" font-size="22" fill="#243B53">Check active state at the server</text><text x="92" y="351" font-size="28" fill="#102A43">Access token</text><text x="92" y="388" font-size="22" fill="#243B53">Check revocation/state, or wait for expiry</text><text x="92" y="454" font-size="28" fill="#102A43">Refresh token</text><text x="92" y="491" font-size="22" fill="#243B53">Stop new tokens by revoking token or family</text><text x="92" y="548" font-size="22" fill="#9C5A0A">Revoking refresh does not automatically kill access.</text></g>
<g id="active-connection" data-pptx-bounds="824 206 392 361"><rect x="824" y="206" width="392" height="361" fill="none" stroke="#5B21B6" stroke-width="2" stroke-dasharray="8 4" /><text x="852" y="252" font-size="28" fill="#5B21B6">SignalR connection</text><text font-size="22" fill="#243B53" x="852" y="316">Disconnect server-side</text><text font-size="22" fill="#243B53" x="852" y="352">or recheck before</text><text font-size="22" fill="#243B53" x="852" y="388">sensitive commands.</text><text font-size="22" fill="#9C5A0A" x="852" y="464">A client logout event</text><text font-size="22" fill="#9C5A0A" x="852" y="500">does not enforce this.</text></g>
<g id="takeaway" data-pptx-bounds="64 590 1152 76"><text x="64" y="621" font-size="28" fill="#102A43">Change something the receiving handler actually checks.</text><text x="64" y="654" font-size="22" fill="#526B80">Then fix the leak, recover the account and test old access paths.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 670 1152 40"><line x1="64" y1="675" x2="1216" y2="675" stroke="#CAD7E2" /><text x="64" y="698" font-size="16" fill="#526B80">Sources: RFC 7009; RFC 7662; Microsoft Learn, SignalR Authentication</text><text x="1216" y="698" text-anchor="end" font-size="16" fill="#526B80">18 / 20</text></g>
</svg>