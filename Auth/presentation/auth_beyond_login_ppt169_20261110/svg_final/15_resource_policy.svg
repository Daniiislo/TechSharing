</g>
<g id="business-after-permission" data-pptx-bounds="785 211 431 345"><rect x="785" y="211" width="431" height="345" fill="#E8F4F8" /><text x="813" y="257" font-size="28" fill="#102A43">After permission</text><line x1="813" y1="291" x2="1188" y2="291" stroke="#CAD7E2" /><text x="813" y="344" font-size="28" fill="#102A43">Business rules</text><text font-size="22" fill="#243B53" x="813" y="391">Is the auction open?</text><text font-size="22" fill="#243B53" x="813" y="427">Is this bid amount valid?</text><text font-size="22" fill="#243B53" x="813" y="463">Can this update commit safely?</text><text x="813" y="527" font-size="22" fill="#526B80">Both belong on the server.</text></g>
<g id="takeaway" data-pptx-bounds="64 590 1152 76"><text x="64" y="621" font-size="28" fill="#102A43">Load trusted facts and authorize the actual resource.</text><text x="64" y="654" font-size="22" fill="#526B80">Client-supplied tenantId or isOwner is not proof of permission.</text></g>
