<text x="88" y="247" font-size="28" fill="#102A43">Permission</text><text x="88" y="284" font-size="22" fill="#526B80">PlaceBid capability, often grouped by role</text><text x="88" y="349" font-size="28" fill="#102A43">Attributes / ABAC</text><text x="88" y="386" font-size="22" fill="#526B80">User and auction belong to the permitted tenant</text><text x="88" y="451" font-size="28" fill="#102A43">Relationships / ReBAC</text><text x="88" y="488" font-size="22" fill="#526B80">Anna is an invited participant in this auction</text>
