<text id="agenda-section" x="64" y="55" font-size="18" fill="#007F9E">01 · Authentication &amp; Sign-In</text>
<text id="slide-title" x="64" y="108" font-size="46" fill="#102A43" font-family="Cambria, serif">PKCE: Protecting the Code Exchange</text>
<text id="slide-context" x="64" y="157" font-size="22" fill="#526B80">The app creates a random verifier for each request and keeps it until the code exchange.</text>
</g>
<g id="main-visual" data-pptx-bounds="64 198 1152 448">
<rect x="112" y="205" width="320" height="67" rx="9" fill="#E8F4F8"/><text x="272" y="233" font-size="22" fill="#102A43" text-anchor="middle" font-weight="700">Calendar app</text><text x="272" y="255" font-size="16" fill="#526B80" text-anchor="middle">Creates and keeps the verifier</text><line x1="272" y1="273" x2="272" y2="570" stroke="#CAD7E2" stroke-width="2"/><rect x="848" y="205" width="320" height="67" rx="9" fill="#E8F4F8"/><text x="1008" y="233" font-size="22" fill="#102A43" text-anchor="middle" font-weight="700">Authorization server</text><text x="1008" y="255" font-size="16" fill="#526B80" text-anchor="middle">Binds the challenge to the code</text><line x1="1008" y1="273" x2="1008" y2="570" stroke="#CAD7E2" stroke-width="2"/><text x="64" y="305" font-size="18" fill="#007F9E" font-weight="700">01 · Request a code</text><text x="640" y="327" font-size="22" fill="#102A43" text-anchor="middle">Send the challenge derived from the verifier</text><path d="M 282 338 H 998 M 988 331 L 998 338 L 988 345" fill="none" stroke="#007F9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="393" font-size="22" fill="#102A43" text-anchor="middle">Return authorization code</text><path d="M 998 404 H 282 M 292 397 L 282 404 L 292 411" fill="none" stroke="#007F9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="464" font-size="18" fill="#007F9E" font-weight="700">02 · Exchange the code</text><text x="640" y="486" font-size="22" fill="#007F9E" text-anchor="middle" font-weight="700">Send authorization code + verifier</text><path d="M 282 497 H 998 M 988 490 L 998 497 L 988 504" fill="none" stroke="#007F9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1008" y="550" font-size="22" fill="#102A43" text-anchor="middle" font-weight="700">Recompute and compare</text><line x1="64" y1="588" x2="1216" y2="588" stroke="#CAD7E2" stroke-width="2"/><text x="64" y="630" font-size="22" fill="#526B80">The server derives the challenge from the verifier again and checks for a match before issuing tokens.</text>
