<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC" />
<g id="title" data-pptx-bounds="64 48 1152 130"><text x="64" y="72" font-size="18" fill="#007F9E">APPENDIX / A1</text><text x="64" y="139" font-family="Cambria, serif" font-size="46" fill="#102A43">HOTP and TOTP Verification Details</text></g>
<g id="otp-construction" data-pptx-bounds="64 204 1152 172"><rect x="64" y="204" width="1152" height="172" fill="#E8F4F8" /><text x="92" y="247" font-family="Consolas, monospace" font-size="24" fill="#102A43">HOTP(K,C) = truncate(HMAC(K,C)) mod 10^digits</text><text x="92" y="292" font-family="Consolas, monospace" font-size="24" fill="#007F9E">TOTP uses C = floor((UnixTime - T0) / X)</text><text x="92" y="342" font-size="22" fill="#526B80">RFC 4226 public test vector: C=0 gives 755224; C=1 gives 287082.</text></g>
<g id="verifier-obligations" data-pptx-bounds="64 408 1152 150"><text x="64" y="443" font-size="28" fill="#102A43">Verifier responsibilities</text><text font-size="22" fill="#243B53" x="64" y="491">Protect the seed and enrollment QR. Limit guesses and resynchronization windows.</text><text font-size="22" fill="#243B53" x="64" y="527">Track accepted steps atomically to prevent replay.</text></g>
<g id="takeaway" data-pptx-bounds="64 590 1152 76"><text x="64" y="621" font-size="28" fill="#102A43">Matching computation still requires guarded verifier state.</text><text x="64" y="654" font-size="22" fill="#9C5A0A">The public test seed is for verification only, never production enrollment.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 670 1152 40"><line x1="64" y1="675" x2="1216" y2="675" stroke="#CAD7E2" /><text x="64" y="698" font-size="16" fill="#526B80">Sources: RFC 4226; RFC 6238. Details and full test seed are in the presenter guide.</text><text x="1216" y="698" text-anchor="end" font-size="16" fill="#526B80">A1 / A6</text></g>
</svg>