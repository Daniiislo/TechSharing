<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#007F9E" /></marker></defs><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC" />
<g id="title" data-pptx-bounds="64 48 1152 130"><text x="64" y="72" font-size="18" fill="#007F9E">APPENDIX / A6</text><text x="64" y="139" font-family="Cambria, serif" font-size="46" fill="#102A43">Revocation Across Active Requests</text></g>
<g id="enforcement-timeline" data-pptx-bounds="64 204 1152 226"><line x1="90" y1="258" x2="1185" y2="258" stroke="#007F9E" stroke-width="3" marker-end="url(#arrow)" /><circle cx="90" cy="258" r="8" fill="#007F9E" /><circle cx="390" cy="258" r="8" fill="#007F9E" /><circle cx="690" cy="258" r="8" fill="#007F9E" /><circle cx="990" cy="258" r="8" fill="#007F9E" />
<text x="90" y="230" font-size="18" fill="#526B80">REVOKE</text><text x="390" y="230" font-size="18" fill="#526B80">PROPAGATE</text><text x="690" y="230" font-size="18" fill="#526B80">ENFORCE</text><text x="990" y="230" font-size="18" fill="#526B80">CONNECTIONS</text><text x="90" y="322" font-size="28" fill="#102A43">Commit state</text><text x="390" y="322" font-size="28" fill="#102A43">Update caches</text><text x="690" y="322" font-size="28" fill="#102A43">API rejects</text><text x="990" y="322" font-size="28" fill="#102A43">Recheck / stop</text><text font-size="22" fill="#243B53" x="90" y="372">Session or token</text><text font-size="22" fill="#243B53" x="90" y="404">marked revoked</text><text font-size="22" fill="#243B53" x="390" y="372">Receiving checks</text><text font-size="22" fill="#243B53" x="390" y="404">see new state</text><text font-size="22" fill="#243B53" x="690" y="372">Old credential</text><text font-size="22" fill="#243B53" x="690" y="404">no longer passes</text><text font-size="22" fill="#243B53" x="990" y="372">Handle open and</text><text font-size="22" fill="#243B53" x="990" y="404">in-flight access</text></g>
<g id="revocation-limits" data-pptx-bounds="64 459 1152 106"><text x="64" y="490" font-size="22" fill="#9C5A0A">Offline JWT validation may accept an issued token until expiry.</text><text x="64" y="537" font-size="22" fill="#243B53">Version checks require current state. Refresh-family revocation is a separate control.</text></g>
<g id="takeaway" data-pptx-bounds="64 590 1152 76"><text x="64" y="621" font-size="28" fill="#102A43">Verify API access, refresh and reconnect with the old credential.</text><text x="64" y="654" font-size="22" fill="#526B80">A successful revoke response alone does not prove all access paths now reject.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 670 1152 40"><line x1="64" y1="675" x2="1216" y2="675" stroke="#CAD7E2" /><text x="64" y="698" font-size="16" fill="#526B80">Sources: RFC 7009; RFC 7662; RFC 9700; Microsoft Learn, SignalR Authentication</text><text x="1216" y="698" text-anchor="end" font-size="16" fill="#526B80">A6 / A6</text></g>
</svg>