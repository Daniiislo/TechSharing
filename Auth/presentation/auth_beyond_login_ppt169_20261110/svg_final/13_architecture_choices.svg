<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#007F9E"/></marker></defs><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC"/>
<g id="title" data-pptx-bounds="64 48 1152 130"><text x="64" y="72" font-size="18" fill="#007F9E">APPLICATION DESIGN</text><text x="64" y="139" font-family="Cambria, serif" font-size="46" fill="#102A43">Choose Where Credentials Live</text></g>
<g id="bff-path" data-pptx-bounds="64 203 1152 104"><text x="64" y="235" font-size="28" fill="#102A43">Browser</text><text x="620" y="235" font-size="28" fill="#102A43">Backend / BFF</text><text x="1120" y="235" font-size="28" fill="#102A43">API</text><line x1="244" y1="228" x2="585" y2="228" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><line x1="865" y1="228" x2="1085" y2="228" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><text x="345" y="271" font-size="22" fill="#007F9E">Session cookie</text><text x="620" y="295" font-size="22" fill="#526B80">Backend for Frontend</text><text x="887" y="271" font-size="22" fill="#007F9E">API token</text></g>
<g id="direct-browser-path" data-pptx-bounds="64 326 1152 102"><line x1="64" y1="326" x2="1216" y2="326" stroke="#CAD7E2"/><text x="64" y="368" font-size="28" fill="#102A43">Browser app / SPA</text><line x1="398" y1="361" x2="1085" y2="361" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><text x="1120" y="368" font-size="28" fill="#102A43">API</text><text x="64" y="411" font-size="22" fill="#526B80">Single-page application</text><text x="560" y="405" font-size="22" fill="#007F9E">Uses API token in the browser</text></g>
<g id="mobile-path" data-pptx-bounds="64 447 1152 113"><line x1="64" y1="447" x2="1216" y2="447" stroke="#CAD7E2"/><text x="64" y="490" font-size="28" fill="#102A43">Mobile app</text><line x1="285" y1="483" x2="650" y2="483" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><text x="688" y="490" font-size="28" fill="#102A43">System browser sign-in</text><text x="64" y="540" font-size="22" fill="#526B80">Consider OIDC for identity and Authorization Code + PKCE for browser/mobile clients.</text></g>
<g id="takeaway" data-pptx-bounds="64 590 1152 76"><text x="64" y="621" font-size="28" fill="#102A43">Who calls? Where are tokens? Which identity provider?</text><text x="64" y="654" font-size="22" fill="#526B80">SSO means sign-in across apps. It can combine with these architectures.</text></g>
