<g id="title" data-pptx-bounds="64 48 1152 130"><text x="64" y="72" font-size="18" fill="#007F9E">APPENDIX / A5 / ASP.NET CORE</text><text x="64" y="139" font-family="Cambria, serif" font-size="46" fill="#102A43">A Resource Authorization Decision</text></g>
<g id="request-check-order" data-pptx-bounds="64 204 650 366"><line x1="90" y1="230" x2="90" y2="542" stroke="#CAD7E2" stroke-width="3" /><text x="119" y="245" font-size="28" fill="#102A43">1  Authenticate the request</text><text x="119" y="304" font-size="28" fill="#102A43">2  Map the internal account</text><text x="119" y="363" font-size="28" fill="#102A43">3  Load the scoped auction</text><text x="119" y="422" font-size="28" fill="#007F9E">4  Authorize this resource</text><text x="119" y="481" font-size="28" fill="#102A43">5  Validate business rules</text><text x="119" y="540" font-size="28" fill="#102A43">6  Commit the action</text></g>
<g id="dotnet-policy" data-pptx-bounds="758 204 458 366"><rect x="758" y="204" width="458" height="366" fill="#E8F4F8" /><text x="786" y="250" font-size="28" fill="#102A43">Resource-aware call</text><text font-family="Consolas, monospace" font-size="24" fill="#007F9E" x="786" y="313">AuthorizeAsync(</text><text font-family="Consolas, monospace" font-size="24" fill="#007F9E" x="786" y="349">  user, auction, policy</text><text font-family="Consolas, monospace" font-size="24" fill="#007F9E" x="786" y="385">)</text><text font-size="22" fill="#243B53" x="786" y="466">A general [Authorize] gate</text><text font-size="22" fill="#243B53" x="786" y="501">does not load and evaluate</text><text font-size="22" fill="#243B53" x="786" y="536">every auction relationship.</text></g>
<g id="takeaway" data-pptx-bounds="64 590 1152 76"><text x="64" y="621" font-size="28" fill="#102A43">Enforce the same required rules at every entry point.</text><text x="64" y="654" font-size="22" fill="#526B80">Missing authentication and insufficient permission are different states.</text></g>
