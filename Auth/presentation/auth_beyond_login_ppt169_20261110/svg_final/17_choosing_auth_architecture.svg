<g id="main-visual" data-pptx-bounds="64 198 1152 448"><g transform="translate(0 -2)"><rect x="64" y="207" width="552" height="150" rx="14" fill="#E8F4F8"/><g transform="translate(91 246) scale(1)" fill="none" stroke="#007F9E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="50" height="38" rx="5"/><path d="M 5 18 H 55 M 12 13 H 14 M 19 13 H 21 M 20 32 H 40"/></g><text x="177" y="248" font-size="18" fill="#007F9E" font-weight="700">Same-origin web</text><text x="177" y="286" font-size="28" fill="#102A43" font-weight="700">Session cookie</text><text x="177" y="323" font-size="22" fill="#526B80">Browser talks to one backend.</text><rect x="664" y="207" width="552" height="150" rx="14" fill="none" stroke="#CAD7E2" stroke-width="2"/><g transform="translate(691 246) scale(1)" fill="none" stroke="#007F9E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="16" r="10"/><path d="M 10 49 V 44 C 10 35 18 31 30 31 C 42 31 50 35 50 44 V 49"/></g><text x="777" y="248" font-size="18" fill="#007F9E" font-weight="700">Company SSO</text><text x="777" y="286" font-size="28" fill="#102A43" font-weight="700">OIDC + app session</text><text x="777" y="323" font-size="22" fill="#526B80">Reuse the company identity provider.</text><rect x="64" y="384" width="552" height="150" rx="14" fill="none" stroke="#CAD7E2" stroke-width="2"/><g transform="translate(91 423) scale(1)" fill="none" stroke="#007F9E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="8" width="48" height="16" rx="4"/><rect x="6" y="31" width="48" height="16" rx="4"/><path d="M 14 16 H 17 M 14 39 H 17 M 28 16 H 45 M 28 39 H 45"/></g><text x="177" y="425" font-size="18" fill="#007F9E" font-weight="700">SPA with a backend</text><text x="177" y="463" font-size="28" fill="#102A43" font-weight="700">Backend for Frontend</text><text x="177" y="500" font-size="22" fill="#526B80">Keep API tokens on the server.</text><rect x="664" y="384" width="552" height="150" rx="14" fill="none" stroke="#CAD7E2" stroke-width="2"/><g transform="translate(691 423) scale(1)" fill="none" stroke="#007F9E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="15" y="4" width="31" height="48" rx="5"/><path d="M 26 44 H 35"/></g><text x="777" y="425" font-size="18" fill="#007F9E" font-weight="700">Mobile + API</text><text x="777" y="463" font-size="28" fill="#102A43" font-weight="700">OIDC code flow + PKCE</text><text x="777" y="500" font-size="22" fill="#526B80">Use the system browser for sign-in.</text></g><line x1="64" y1="587" x2="1216" y2="587" stroke="#CAD7E2" stroke-width="2"/><text x="64" y="630" font-size="22" fill="#526B80">Need immediate revocation? Check current state on the request path.</text></g>
