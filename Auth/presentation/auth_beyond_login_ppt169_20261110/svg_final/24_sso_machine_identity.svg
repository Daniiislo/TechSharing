<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#007F9E"/></marker></defs><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC"/>
<g id="title" data-pptx-bounds="64 48 1152 130"><text x="64" y="72" font-size="18" fill="#007F9E">APPENDIX / A4</text><text x="64" y="139" font-family="Cambria, serif" font-size="46" fill="#102A43">SSO and Application Identity</text></g>
<g id="user-sso" data-pptx-bounds="64 205 1152 175"><text x="64" y="242" font-size="28" fill="#102A43">User SSO</text><text x="280" y="242" font-size="28" fill="#102A43">App A</text><text x="674" y="242" font-size="28" fill="#007F9E">Identity provider</text><text x="1120" y="242" font-size="28" fill="#102A43">App B</text><line x1="390" y1="235" x2="645" y2="235" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><line x1="914" y1="235" x2="1090" y2="235" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="300" font-size="22" fill="#243B53">Apps trust one identity provider using OIDC or SAML, per integration.</text><text x="280" y="346" font-size="22" fill="#526B80">Application sessions and the identity-provider session remain distinct.</text></g>
<g id="application-caller" data-pptx-bounds="64 408 1152 154"><line x1="64" y1="408" x2="1216" y2="408" stroke="#CAD7E2"/><text x="64" y="456" font-size="28" fill="#102A43">Service identity</text><text x="361" y="456" font-size="28" fill="#102A43">Background worker</text><line x1="676" y1="449" x2="1060" y2="449" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><text x="1090" y="456" font-size="28" fill="#102A43">API</text><text x="361" y="514" font-size="22" fill="#243B53">Application rights, e.g. OAuth Client Credentials where suitable.</text><text x="361" y="549" font-size="22" fill="#526B80">No interactive user login is implied.</text></g>
<g id="takeaway" data-pptx-bounds="64 590 1152 76"><text x="64" y="621" font-size="28" fill="#102A43">SSO is a cross-app requirement. A worker is a different caller.</text><text x="64" y="654" font-size="22" fill="#526B80">Service credentials need their own permissions and lifecycle.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 670 1152 40"><line x1="64" y1="675" x2="1216" y2="675" stroke="#CAD7E2"/><text x="64" y="698" font-size="16" fill="#526B80">Sources: OpenID Connect Core; local research on OAuth, SAML and machine authentication</text><text x="1216" y="698" text-anchor="end" font-size="16" fill="#526B80">A4 / A6</text></g>
</svg>
