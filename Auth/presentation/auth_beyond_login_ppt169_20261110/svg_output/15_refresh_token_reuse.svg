<text id="agenda-section" x="64" y="55" font-size="18" fill="#007F9E">04 · Session Security &amp; Revocation</text>
<text id="slide-title" x="64" y="108" font-size="46" fill="#102A43" font-family="Cambria, serif">Refresh Token Rotation</text>
<text id="slide-context" x="64" y="157" font-size="22" fill="#526B80">Each successful refresh issues a replacement token and retires the previous one.</text>
</g>
