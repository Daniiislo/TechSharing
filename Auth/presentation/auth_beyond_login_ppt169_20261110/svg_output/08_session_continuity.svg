<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#007F9E"/></marker></defs><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC"/>
<g id="title" data-pptx-bounds="64 48 1152 130"><text x="64" y="72" font-size="18" fill="#007F9E">AFTER AUTHENTICATION</text><text x="64" y="139" font-family="Cambria, serif" font-size="46" fill="#102A43">The Next Request Still Needs Proof</text></g>
<g id="session-exchange" data-pptx-bounds="64 202 1152 362">
<rect x="64" y="202" width="340" height="330" fill="#E8F4F8"/><rect x="876" y="202" width="340" height="330" fill="none" stroke="#102A43" stroke-width="2"/>
<text x="92" y="246" font-size="28" fill="#102A43">Browser</text><text x="904" y="246" font-size="28" fill="#102A43">Server</text>
<line x1="420" y1="300" x2="856" y2="300" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><text x="640" y="284" text-anchor="middle" font-size="22" fill="#243B53">1  Complete authentication</text>
<line x1="856" y1="362" x2="420" y2="362" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><text x="640" y="346" text-anchor="middle" font-size="22" fill="#243B53">2  Set session cookie</text>
<line x1="420" y1="424" x2="856" y2="424" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><text x="640" y="408" text-anchor="middle" font-size="22" fill="#243B53">3  Send bid with cookie</text>
<text x="92" y="478" font-family="Consolas, monospace" font-size="24" fill="#007F9E">Cookie: sid=...</text><text x="904" y="468" font-family="Consolas, monospace" font-size="24" fill="#007F9E">sid → Anna, active</text><text x="904" y="508" font-size="22" fill="#243B53">4  Look up and check session</text>
<text x="64" y="556" font-size="22" fill="#526B80">Example: server-side session. Protected cookie tickets are another design.</text>
</g>
<g id="takeaway" data-pptx-bounds="64 590 1152 76"><text x="64" y="625" font-size="28" fill="#102A43">Cookie carries data. Session defines access continuity.</text><text x="64" y="654" font-size="22" fill="#526B80">HttpOnly limits script reads; cookie-based access still needs CSRF/XSS protection.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 670 1152 40"><line x1="64" y1="675" x2="1216" y2="675" stroke="#CAD7E2"/><text x="64" y="698" font-size="16" fill="#526B80">Source: OWASP Session Management Cheat Sheet</text><text x="1216" y="698" text-anchor="end" font-size="16" fill="#526B80">08 / 20</text></g>
</svg>
