<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#007F9E"/></marker></defs>
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC"/>
<g id="title" data-pptx-bounds="64 48 1152 125"><text x="64" y="72" font-size="18" fill="#007F9E">TIME-BASED ONE-TIME PASSWORD</text><text x="64" y="139" font-family="Cambria, serif" font-size="46" fill="#102A43">TOTP: Let Time Move the Counter</text></g>
<g id="time-step-exchange" data-pptx-bounds="64 196 1152 364">
<rect x="64" y="196" width="370" height="255" fill="#E8F4F8"/><rect x="846" y="196" width="370" height="255" fill="none" stroke="#102A43" stroke-width="2"/>
<text x="92" y="240" font-size="28" fill="#102A43">Authenticator</text><text x="874" y="240" font-size="28" fill="#102A43">Server</text>
<text x="92" y="296" font-family="Consolas, monospace" font-size="24" fill="#243B53">K + current time step</text><text x="874" y="296" font-family="Consolas, monospace" font-size="24" fill="#243B53">K + current time step</text>
<line x1="450" y1="337" x2="826" y2="337" stroke="#007F9E" stroke-width="3" marker-end="url(#arrow)"/><text x="640" y="307" text-anchor="middle" font-size="22" fill="#007F9E">Same inputs, same code</text>
<text x="92" y="403" font-size="22" fill="#243B53">Computes locally, even offline</text><text x="874" y="385" font-size="22" fill="#243B53">Check bounded clock drift<tspan x="874" dy="32">and reject accepted-code replay</tspan></text>
<line x1="90" y1="505" x2="1185" y2="505" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><line x1="90" y1="493" x2="90" y2="517" stroke="#007F9E" stroke-width="2"/><line x1="454" y1="493" x2="454" y2="517" stroke="#007F9E" stroke-width="2"/><line x1="819" y1="493" x2="819" y2="517" stroke="#007F9E" stroke-width="2"/>
<text x="90" y="542" font-size="22" fill="#526B80">0 s</text><text x="454" y="542" font-size="22" fill="#526B80">30 s</text><text x="819" y="542" font-size="22" fill="#526B80">60 s</text><text x="1095" y="542" font-size="22" fill="#526B80">Example</text>
</g>
<g id="takeaway" data-pptx-bounds="64 580 1152 80"><text x="64" y="612" font-size="32" fill="#102A43">Time changes the input without another button press.</text><text x="64" y="646" font-size="22" fill="#9C5A0A">SMS/email describes delivery. Typed OTPs can still be relayed by phishing.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 670 1152 40"><line x1="64" y1="675" x2="1216" y2="675" stroke="#CAD7E2"/><text x="64" y="698" font-size="16" fill="#526B80">Sources: RFC 6238; OWASP MFA Cheat Sheet</text><text x="1216" y="698" text-anchor="end" font-size="16" fill="#526B80">05 / 20</text></g>
</svg>
