<text id="agenda-section" x="64" y="55" font-size="18" fill="#007F9E">01 · Authentication &amp; Sign-In</text>
<text id="slide-title" x="64" y="108" font-size="46" fill="#102A43" font-family="Cambria, serif">OAuth 2.0: Grant Access to an API</text>
<text id="slide-context" x="64" y="157" font-size="22" fill="#526B80">Anna grants calendar access. OAuth delegates access to resources.</text>
