<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#007F9E"/></marker></defs><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC"/>
<g id="title" data-pptx-bounds="64 48 1152 130"><text x="64" y="72" font-size="18" fill="#007F9E">DETECTION</text><text x="64" y="139" font-family="Cambria, serif" font-size="46" fill="#102A43">Would We Notice a Stolen Session?</text></g>
<g id="risk-signals" data-pptx-bounds="64 210 465 350"><text x="64" y="250" font-size="28" fill="#102A43">Signals we can observe</text><text x="64" y="311" font-size="22" fill="#243B53">User reports an unfamiliar session<tspan x="64" dy="47">Unusual account activity</tspan><tspan x="64" dy="47">Recovery or MFA settings change</tspan></text><text x="64" y="513" font-size="22" fill="#9C5A0A">A new IP is a clue, not a verdict.</text></g>
<g id="refresh-reuse" data-pptx-bounds="577 210 639 350"><rect x="577" y="210" width="639" height="350" fill="#E8F4F8"/><text x="605" y="252" font-size="28" fill="#102A43">If refresh-token rotation exists</text><text x="605" y="321" font-family="Consolas, monospace" font-size="24" fill="#243B53">R1 used</text><line x1="765" y1="313" x2="930" y2="313" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><text x="960" y="321" font-family="Consolas, monospace" font-size="24" fill="#007F9E">R2 issued</text><line x1="605" y1="358" x2="1187" y2="358" stroke="#CAD7E2"/><text x="605" y="405" font-size="28" fill="#9C5A0A">Old R1 appears again</text><text x="605" y="454" font-size="22" fill="#243B53">Possible copied token or race/retry.<tspan x="605" dy="35">The server cannot identify the attacker</tspan><tspan x="605" dy="35">from reuse alone.</tspan></text></g>
<g id="takeaway" data-pptx-bounds="64 590 1152 76"><text x="64" y="621" font-size="28" fill="#102A43">Valid credentials do not announce that someone copied them.</text><text x="64" y="654" font-size="22" fill="#526B80">Use risk signals to investigate, challenge or block according to policy.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 670 1152 40"><line x1="64" y1="675" x2="1216" y2="675" stroke="#CAD7E2"/><text x="64" y="698" font-size="16" fill="#526B80">Sources: RFC 9700 §4.14; OWASP Authentication Cheat Sheet</text><text x="1216" y="698" text-anchor="end" font-size="16" fill="#526B80">17 / 20</text></g>
</svg>
