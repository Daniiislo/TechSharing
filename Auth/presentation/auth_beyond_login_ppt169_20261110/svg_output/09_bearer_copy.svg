<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#007F9E"/></marker></defs><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC"/>
<g id="title" data-pptx-bounds="64 48 1152 130"><text x="64" y="72" font-size="18" fill="#007F9E">CREDENTIAL POSSESSION</text><text x="64" y="139" font-family="Cambria, serif" font-size="46" fill="#102A43">A Valid Token Can Still Be Stolen</text></g>
<g id="two-presenters" data-pptx-bounds="64 218 1152 327">
<text x="96" y="280" font-size="32" fill="#102A43">Anna</text><text x="96" y="326" font-size="22" fill="#526B80">Original bearer credential</text><line x1="420" y1="299" x2="875" y2="365" stroke="#007F9E" stroke-width="3" marker-end="url(#arrow)"/>
<text x="96" y="443" font-size="32" fill="#102A43">Lab client B</text><text x="96" y="489" font-size="22" fill="#9C5A0A">Copy of the same credential</text><line x1="420" y1="452" x2="875" y2="386" stroke="#007F9E" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="900" y="297" width="316" height="162" fill="#E8F4F8"/><text x="928" y="345" font-size="28" fill="#102A43">Verifier / API</text><text x="928" y="393" font-size="22" fill="#243B53">Same presented identity</text><text x="928" y="430" font-size="22" fill="#243B53">Validity checks can pass</text>
</g>
<g id="takeaway" data-pptx-bounds="64 578 1152 82"><text x="64" y="610" font-size="32" fill="#102A43">A valid signature does not identify the current holder.</text><text x="64" y="650" font-size="22" fill="#526B80">JWT is a format. Bearer is a usage model. A signature does not encrypt the payload.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 670 1152 40"><line x1="64" y1="675" x2="1216" y2="675" stroke="#CAD7E2"/><text x="64" y="698" font-size="16" fill="#526B80">Sources: RFC 9700; OWASP Session Management Cheat Sheet</text><text x="1216" y="698" text-anchor="end" font-size="16" fill="#526B80">09 / 20</text></g>
</svg>
