<text id="agenda-section" x="64" y="55" font-size="18" fill="#007F9E">04 · Revocation</text>
<text id="slide-title" x="64" y="108" font-size="46" fill="#102A43" font-family="Cambria, serif">Revoking Sessions &amp; Tokens</text>
<text id="slide-context" x="64" y="157" font-size="22" fill="#526B80">Three credentials, three revocation actions.</text>
</g>
<g id="main-visual" data-pptx-bounds="64 198 1152 448">
<circle cx="240" cy="255" r="48" fill="#E8F4F8"/>
<g transform="translate(240 255)" fill="none" stroke="#007F9E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-25" y="-20" width="50" height="40" rx="5"/><path d="M -12 -7 H 12 M -12 6 H 5"/></g>
<text x="240" y="350" text-anchor="middle" font-size="26" fill="#102A43" font-weight="700">Session</text>
<text x="240" y="414" text-anchor="middle" font-size="26" fill="#007F9E">Delete the session</text>
<text x="240" y="509" text-anchor="middle" font-size="26" fill="#102A43">Next request is rejected.</text>
<circle cx="640" cy="255" r="48" fill="#E8F4F8"/>
<g transform="translate(640 255)" fill="none" stroke="#007F9E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="-9" cy="-4" r="13"/><path d="M 4 -4 H 29 V 8 M 19 -4 V 4"/></g>
<text x="640" y="350" text-anchor="middle" font-size="26" fill="#102A43" font-weight="700">Access token</text>
<text x="640" y="414" text-anchor="middle" font-size="26" fill="#007F9E">Add to denylist</text>
<text x="640" y="450" text-anchor="middle" font-size="26" fill="#007F9E">until token expiry</text>
<text x="640" y="509" text-anchor="middle" font-size="26" fill="#102A43">API checks the denylist</text>
<text x="640" y="545" text-anchor="middle" font-size="26" fill="#102A43">and rejects the token.</text>
<circle cx="1040" cy="255" r="48" fill="#E8F4F8"/>
<g transform="translate(1040 255)" fill="none" stroke="#007F9E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M -23 -5 A 24 24 0 0 1 21 -12 M 21 -12 V -27 M 21 -12 H 6 M 23 5 A 24 24 0 0 1 -21 12 M -21 12 V 27 M -21 12 H -6"/></g>
<text x="1040" y="350" text-anchor="middle" font-size="26" fill="#102A43" font-weight="700">Refresh token</text>
<text x="1040" y="414" text-anchor="middle" font-size="26" fill="#007F9E">Revoke the token</text>
<text x="1040" y="450" text-anchor="middle" font-size="26" fill="#007F9E">or its token family</text>
<text x="1040" y="509" text-anchor="middle" font-size="26" fill="#102A43">Next refresh is rejected.</text>
<line x1="64" y1="588" x2="1216" y2="588" stroke="#CAD7E2" stroke-width="2"/>
<text x="640" y="630" text-anchor="middle" font-size="26" fill="#526B80">Refresh revocation does not revoke existing access tokens.</text>
</g>
