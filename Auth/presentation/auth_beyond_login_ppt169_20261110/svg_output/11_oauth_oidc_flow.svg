<g id="takeaway" data-pptx-bounds="64 590 1152 76"><text x="64" y="621" font-size="28" fill="#102A43">Access token: for the API. ID token: for the client.</text><text x="64" y="654" font-size="22" fill="#526B80">Generic code flow. The app must validate results and manage its own session.</text></g>
