<text x="160" y="249" text-anchor="middle" font-size="28" fill="#102A43">Client</text><text x="675" y="249" text-anchor="middle" font-size="28" fill="#102A43">Provider</text><text x="1120" y="249" text-anchor="middle" font-size="28" fill="#102A43">API</text>
<text x="160" y="278" text-anchor="middle" font-size="18" fill="#526B80">Browser + app</text><text x="675" y="278" text-anchor="middle" font-size="18" fill="#526B80">Identity / authorization server</text><text x="1120" y="278" text-anchor="middle" font-size="18" fill="#526B80">Resource server</text>
