<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#007F9E"/></marker></defs><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC"/>
<g id="title" data-pptx-bounds="64 48 1152 156"><text x="64" y="72" font-size="18" fill="#007F9E">PASSKEY / AUTHENTICATION</text><text x="64" y="128" font-family="Cambria, serif" font-size="46" fill="#102A43">Passkeys: Prove Possession<tspan x="64" dy="54">Without Sending the Key</tspan></text></g>
<g id="authentication-ceremony" data-pptx-bounds="64 220 1152 357">
<text x="180" y="250" text-anchor="middle" font-size="28" fill="#102A43">Browser</text><text x="650" y="250" text-anchor="middle" font-size="28" fill="#102A43">Authenticator</text><text x="1090" y="250" text-anchor="middle" font-size="28" fill="#102A43">Backend</text>
<line x1="180" y1="265" x2="180" y2="545" stroke="#CAD7E2" stroke-width="2"/><line x1="650" y1="265" x2="650" y2="545" stroke="#CAD7E2" stroke-width="2"/><line x1="1090" y1="265" x2="1090" y2="545" stroke="#CAD7E2" stroke-width="2"/>
<line x1="180" y1="300" x2="1090" y2="300" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><text x="275" y="288" font-size="22" fill="#243B53">1  Request sign-in options</text>
<line x1="1090" y1="350" x2="180" y2="350" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><text x="275" y="338" font-size="22" fill="#243B53">2  Return a fresh challenge</text>
<line x1="180" y1="400" x2="650" y2="400" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><text x="211" y="388" font-family="Consolas, monospace" font-size="24" fill="#007F9E">3  credentials.get()</text>
<line x1="650" y1="450" x2="180" y2="450" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><text x="211" y="438" font-size="22" fill="#243B53">Local verification; sign ceremony data</text>
<line x1="180" y1="500" x2="1090" y2="500" stroke="#007F9E" stroke-width="2" marker-end="url(#arrow)"/><text x="275" y="488" font-size="22" fill="#243B53">4  Submit assertion for server verification</text>
<text x="180" y="558" font-size="22" fill="#526B80">No fingerprint is sent to the backend</text><text x="840" y="558" font-size="22" fill="#007F9E">Signature + challenge + origin/RP</text>
</g>
<g id="takeaway" data-pptx-bounds="64 590 1152 76"><text x="64" y="625" font-size="28" fill="#102A43">A website-bound signature replaces the typed secret.</text><text x="64" y="654" font-size="22" fill="#9C5A0A">Recovery and the session created after login still need protection.</text></g>
