<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC"/>
<g id="title" data-pptx-bounds="64 48 1152 130"><text x="64" y="72" font-size="18" fill="#007F9E">APPENDIX / A3</text><text x="64" y="139" font-family="Cambria, serif" font-size="46" fill="#102A43">OAuth and OIDC Validation Boundaries</text></g>
<g id="client-validation" data-pptx-bounds="64 208 540 224"><rect x="64" y="208" width="540" height="224" fill="#E8F4F8"/><text x="92" y="252" font-size="28" fill="#102A43">Client checks ID token</text><text x="92" y="307" font-size="22" fill="#243B53">Issuer, audience, signature and algorithm<tspan x="92" dy="36">Time and required flow claims</tspan><tspan x="92" dy="36">Nonce when required by the flow</tspan></text></g>
<g id="api-validation" data-pptx-bounds="652 208 564 224"><rect x="652" y="208" width="564" height="224" fill="none" stroke="#102A43" stroke-width="2"/><text x="680" y="252" font-size="28" fill="#102A43">API checks access token</text><text x="680" y="307" font-size="22" fill="#243B53">Correct recipient and token validity<tspan x="680" dy="36">Granted scope / permissions</tspan><tspan x="680" dy="36">Current access to this resource</tspan></text></g>
<g id="flow-protections" data-pptx-bounds="64 462 1152 104"><text x="64" y="491" font-size="22" fill="#243B53">PKCE binds code exchange. State supports transaction / CSRF protection.<tspan x="64" dy="35">Nonce binds OIDC results to the request according to the flow and provider contract.</tspan></text></g>
<g id="takeaway" data-pptx-bounds="64 590 1152 76"><text x="64" y="621" font-size="28" fill="#102A43">Decode is not validation. Each recipient has its own checks.</text><text x="64" y="654" font-size="22" fill="#526B80">Use standard libraries configured for the issuer, client and API.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 670 1152 40"><line x1="64" y1="675" x2="1216" y2="675" stroke="#CAD7E2"/><text x="64" y="698" font-size="16" fill="#526B80">Sources: OpenID Connect Core; RFC 7636; RFC 9700</text><text x="1216" y="698" text-anchor="end" font-size="16" fill="#526B80">A3 / A6</text></g>
</svg>
