<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#007F9E"/></marker></defs>
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC"/>
<g id="title" data-pptx-bounds="64 48 1152 125"><text x="64" y="72" font-size="18" fill="#007F9E">HMAC-BASED ONE-TIME PASSWORD</text><text x="64" y="139" font-family="Cambria, serif" font-size="46" fill="#102A43">HOTP: Keep the Counters in Sync</text></g>
<g id="shared-counter-exchange" data-pptx-bounds="64 196 1152 352">
<rect x="64" y="196" width="370" height="310" fill="#E8F4F8"/><rect x="846" y="196" width="370" height="310" fill="none" stroke="#102A43" stroke-width="2"/>
<text x="92" y="240" font-size="28" fill="#102A43">Authenticator</text><text x="874" y="240" font-size="28" fill="#102A43">Server</text>
<text x="92" y="297" font-family="Consolas, monospace" font-size="24" fill="#243B53">Shared secret K</text><text x="874" y="297" font-family="Consolas, monospace" font-size="24" fill="#243B53">Same secret K</text>
<text x="92" y="343" font-family="Consolas, monospace" font-size="24" fill="#007F9E">Counter C = 0</text><text x="874" y="343" font-family="Consolas, monospace" font-size="24" fill="#007F9E">Counter C = 0</text>
<line x1="450" y1="369" x2="826" y2="369" stroke="#007F9E" stroke-width="3" marker-end="url(#arrow)"/><text x="640" y="339" text-anchor="middle" font-family="Consolas, monospace" font-size="24" fill="#007F9E">755224</text><text x="640" y="408" text-anchor="middle" font-size="22" fill="#526B80">User submits the code</text>
<text x="92" y="449" font-size="22" fill="#243B53">Next generation advances C</text><text x="874" y="449" font-size="22" fill="#243B53">Match; accept; advance C</text>
<text x="92" y="486" font-family="Consolas, monospace" font-size="24" fill="#526B80">C = 1: 287082</text><text x="874" y="486" font-family="Consolas, monospace" font-size="24" fill="#526B80">Next expected C = 1</text>
<text x="64" y="539" font-size="22" fill="#526B80">Extra code generations can move the app ahead of the server.</text>
</g>
<g id="takeaway" data-pptx-bounds="64 580 1152 80"><text x="64" y="612" font-size="32" fill="#102A43">The counter changes with events.</text><text x="64" y="646" font-size="22" fill="#9C5A0A">HOTP has no inherent 30-second expiry.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 670 1152 40"><line x1="64" y1="675" x2="1216" y2="675" stroke="#CAD7E2"/><text x="64" y="698" font-size="16" fill="#526B80">Source: RFC 4226, public test vector. Never use the example seed in production.</text><text x="1216" y="698" text-anchor="end" font-size="16" fill="#526B80">04 / 20</text></g>
</svg>
