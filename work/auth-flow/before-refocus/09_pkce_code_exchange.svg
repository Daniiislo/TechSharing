<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Segoe UI, sans-serif">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC" />
<g id="title" data-pptx-bounds="64 33 1152 135" font-weight="400" text-anchor="start"><text x="64" y="55" font-size="18" fill="#007F9E">01 · Authentication &amp; Sign-In</text>
<text x="64" y="108" font-size="44" fill="#102A43">PKCE: Protect the Code Exchange</text>
<text x="64" y="153" font-size="21" fill="#526B80">Anna signs in with Google and grants the app permission to read her calendar.</text>
</g><g id="flow-and-explanation" data-pptx-bounds="64 185 1152 410"><rect x="130" y="185" width="170" height="44" rx="8" fill="#E8F4F8" />
<text x="215" y="214" font-size="20" fill="#102A43" font-weight="700" text-anchor="middle">Calendar app</text>
<line x1="215" y1="231" x2="215" y2="598" stroke="#CAD7E2" stroke-width="2" />
<rect x="480" y="185" width="170" height="44" rx="8" fill="#E8F4F8" />
<text x="565" y="214" font-size="20" fill="#102A43" font-weight="700" text-anchor="middle">Google</text>
<line x1="565" y1="231" x2="565" y2="598" stroke="#CAD7E2" stroke-width="2" />
<rect x="725" y="185" width="170" height="44" rx="8" fill="#E8F4F8" />
<text x="810" y="214" font-size="20" fill="#102A43" font-weight="700" text-anchor="middle">Calendar API</text>
<line x1="810" y1="231" x2="810" y2="598" stroke="#CAD7E2" stroke-width="2" />
<rect x="65" y="238" width="830" height="43" rx="6" fill="#E8F4F8" />
<text x="78" y="260" font-size="18" fill="#007F9E" font-weight="700" text-anchor="start">1</text>
<text x="110" y="260" font-size="18" fill="#007F9E" font-weight="700" text-anchor="start">Keep verifier; compute challenge</text>
<rect x="65" y="286" width="830" height="43" rx="6" fill="#E8F4F8" />
<text x="78" y="308" font-size="18" fill="#007F9E" font-weight="700" text-anchor="start">2</text>
<text x="390" y="308" font-size="18" fill="#007F9E" font-weight="700" text-anchor="middle">openid + calendar scope + challenge</text>
<path d="M 225 318 H 555 M 547 313 L 555 318 L 547 323" fill="none" stroke="#007F9E" stroke-width="2" />
<text x="78" y="356" font-size="18" fill="#526B80" font-weight="700" text-anchor="start">3</text>
<text x="390" y="356" font-size="18" fill="#526B80" font-weight="400" text-anchor="middle">Anna signs in and grants access</text>
<text x="78" y="404" font-size="18" fill="#526B80" font-weight="700" text-anchor="start">4</text>
<text x="390" y="404" font-size="18" fill="#526B80" font-weight="400" text-anchor="middle">Return authorization code</text>
<path d="M 555 414 H 225 M 233 409 L 225 414 L 233 419" fill="none" stroke="#526B80" stroke-width="2" />
<rect x="65" y="430" width="830" height="43" rx="6" fill="#E8F4F8" />
<text x="78" y="452" font-size="18" fill="#007F9E" font-weight="700" text-anchor="start">5</text>
<text x="390" y="452" font-size="18" fill="#007F9E" font-weight="700" text-anchor="middle">Exchange code + verifier</text>
<path d="M 225 462 H 555 M 547 457 L 555 462 L 547 467" fill="none" stroke="#007F9E" stroke-width="2" />
<text x="78" y="500" font-size="18" fill="#526B80" font-weight="700" text-anchor="start">6</text>
<text x="390" y="500" font-size="18" fill="#526B80" font-weight="400" text-anchor="middle">Return ID token + access token</text>
<path d="M 555 510 H 225 M 233 505 L 225 510 L 233 515" fill="none" stroke="#526B80" stroke-width="2" />
<text x="78" y="548" font-size="18" fill="#526B80" font-weight="700" text-anchor="start">7</text>
<text x="600" y="548" font-size="18" fill="#526B80" font-weight="400" text-anchor="middle">Read calendar + access token</text>
<path d="M 225 558 H 800 M 792 553 L 800 558 L 792 563" fill="none" stroke="#526B80" stroke-width="2" />
<line x1="923" y1="185" x2="923" y2="595" stroke="#CAD7E2" />
<text x="950" y="215" font-size="26" fill="#007F9E" font-weight="700" text-anchor="start">PKCE</text>
<text x="950" y="254" font-size="19" fill="#102A43" font-weight="700" text-anchor="start">Before redirect</text>
<text x="950" y="279" font-size="16" fill="#526B80" font-weight="400" text-anchor="start">Create a random verifier.<tspan x="950" dy="23">Keep it secret in the app.</tspan></text>
<text x="950" y="340" font-size="19" fill="#102A43" font-weight="700" text-anchor="start">Step 2: send challenge</text>
<text x="950" y="365" font-size="16" fill="#526B80" font-weight="400" text-anchor="start">BASE64URL(SHA256(verifier))<tspan x="950" dy="23">code_challenge_method=S256</tspan></text>
<text x="950" y="426" font-size="19" fill="#102A43" font-weight="700" text-anchor="start">Step 5: send verifier</text>
<text x="950" y="451" font-size="16" fill="#526B80" font-weight="400" text-anchor="start">Google computes the hash again.<tspan x="950" dy="23">It must match the saved challenge.</tspan></text>
<text x="950" y="512" font-size="19" fill="#102A43" font-weight="700" text-anchor="start">Why it helps</text>
<text x="950" y="537" font-size="16" fill="#526B80" font-weight="400" text-anchor="start">A stolen code alone is insufficient.</text>
</g><g id="takeaway" data-pptx-bounds="64 611 1152 45"><line x1="64" y1="611" x2="1216" y2="611" stroke="#CAD7E2" />
<text x="64" y="640" font-size="21" fill="#007F9E" font-weight="700" text-anchor="start">Google hashes the received verifier and compares it with the saved challenge.</text>
</g><g id="footer" data-pptx-role="footer" data-pptx-bounds="64 675 1152 30"><line x1="64" y1="675" x2="1216" y2="675" stroke="#CAD7E2" />
<text x="64" y="698" font-size="16" fill="#526B80" font-weight="400" text-anchor="start">OpenID Connect Core · OAuth 2.0 · RFC 7636 (PKCE)</text>
<text x="1216" y="698" font-size="16" fill="#526B80" font-weight="400" text-anchor="end">09 / 19</text>
</g></svg>
